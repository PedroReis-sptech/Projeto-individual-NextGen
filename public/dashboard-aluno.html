<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen - Dashboard Atleta</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styleDashboardAluno.css">
</head>
<body>
<div class="estrutura">

  <nav class="menu-lateral">
    <img class="logo" src="../Logo/Next-removebg-preview.png" onclick="window.location.href = 'index.html'">
    <a href="dashboard-aluno.html" class="link-menu ativo">Dashboard</a>
    <a href="perfil.html" class="link-menu">Perfil</a>
    <a href="peneiras.html" class="link-menu">Peneiras</a>
    <a href="meus-treinos.html" class="link-menu">Meus Treinos</a>
    <a href="#" class="link-menu" onclick="storage.logout()">Sair</a>
  </nav>

  <main class="conteudo-principal">

    <div id="userCard" class="ficha-usuario">
      <div>
        <span id="cardNome">-</span><br>
        <small id="cardCategoria">-</small>
      </div>
    </div>

    <div class="boas-vindas">Ola, <span id="primNome">Atleta</span>!</div>
    <p class="subtitulo-pagina">Sua temporada 2026 - <span id="cardPos">-</span></p>

    <div class="grade-estatisticas" id="gradeStats"></div>

    <div class="linha-graficos">
      <div class="caixa-grafico largo">
        <h3>Presenca nos treinos - ultimas 8 semanas</h3>
        <canvas id="cPresenca"></canvas>
      </div>
    </div>

    <div class="linha-graficos">
      <div class="caixa-grafico">
        <h3>Evolucao de desempenho</h3>
        <canvas id="cEvolucao"></canvas>
      </div>
      <div class="caixa-grafico">
        <h3>Proximas peneiras</h3>
        <div id="proximasPeneiras"></div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  var storage = {
  login: function(user) {
    localStorage.setItem('sessaoUser', JSON.stringify(user));
  },
  logout: function() {
    localStorage.removeItem('sessaoUser');
    window.location.href = 'login.html';
  },
  current: function() {
    try {
      return JSON.parse(localStorage.getItem('sessaoUser')) || null;
    } catch(e) {
      return null;
    }
  },
  require: function(tipo) {
  var u = this.current();
  if (!u) {
    window.location.href = 'login.html';
    return null;
  }
  if (tipo && u.tipo !== tipo) {
    window.location.href = u.tipo === 'aluno' ? 'dashboard-aluno.html' : 'dashboard-admin.html';
    return null;
  }
  return u;
}
};

function alerta(mensagem, tipo) {
  var tipo_final = tipo || 'sucesso';
  var caixa = document.getElementById('toastContainer');
  if (!caixa) {
    caixa = document.createElement('div');
    caixa.id = 'toastContainer';
    caixa.className = 'caixa-alertas';
    document.body.appendChild(caixa);
  }
  var t = document.createElement('div');
  t.className = 'alerta alerta-' + tipo_final;
  t.innerHTML = '<span>' + (tipo_final === 'sucesso' ? '✓' : '✕') + '</span> ' + mensagem;
  caixa.appendChild(t);
  setTimeout(function() {
    t.remove();
  }, 3200);
}
  var graficoEvolucao = null;

  function carregarPeneiras() {
    fetch('/peneiras')
      .then(function(resposta) { return resposta.json(); })
      .then(function(peneiras) {
        var caixa = document.getElementById('proximasPeneiras');

        if (!peneiras || peneiras.length === 0) {
          caixa.innerHTML = '<p style="color:var(--grey)">Nenhuma peneira disponivel no momento.</p>';
          return;
        }

        var html = '';
        var limite = 3;

        if (peneiras.length < limite) {
          limite = peneiras.length;
        }

        for (var i = 0; i < limite; i++) {
          var p = peneiras[i];
          var dataFormatada = p.data_realizacao
            ? p.data_realizacao.split('T')[0].split('-').reverse().join('/')
            : '-';

          html += '<div class="peneira-pequena">';
          html +=   '<div class="circulo-icone"><span class="icone-futebol">&#9917;</span></div>';
          html +=   '<div>';
          html +=     '<h4>' + (p.nome || '-') + '</h4>';
          html +=     '<p>' + dataFormatada + (p.cidade ? ' - ' + p.cidade : '') + '</p>';
          html +=   '</div>';
          html +=   '<span class="selo selo-verde" style="margin-left:auto">ativa</span>';
          html += '</div>';
        }

        caixa.innerHTML = html;
      })
      .catch(function(erro) {
        console.error('Erro ao carregar peneiras:', erro);
        document.getElementById('proximasPeneiras').innerHTML =
          '<p style="color: red">Erro ao carregar peneiras.</p>';
      });
  }

  function carregarMetricasAluno(idAtleta) {
    fetch('/estatisticas/aluno/' + idAtleta)
      .then(function(resposta) {
        if (!resposta.ok) {
          return resposta.json().then(function(err) {
            throw new Error(err.mensagem || 'Erro ao carregar métricas');
          });
        }
        return resposta.json();
      })
      .then(function(dados) {
        var stats = [
          { nome: 'Treinos no mes', valor: dados.kpis.treinosNoMes || 0, sub: 'atualizado' },
          { nome: '% Presenca', valor: (dados.kpis.taxaPresenca || 0) + '%', sub: 'historico total' },
          { nome: 'Treinos concluidos', valor: dados.kpis.treinosConcluidos || 0, sub: 'total' },
          { nome: 'Desempenho', valor: dados.kpis.desempenho || 0, sub: 'nota atual' }
        ];

        var html = '';
        for (var i = 0; i < stats.length; i++) {
          html += '<div class="cartao-estatistica">';
          html +=   '<p>' + stats[i].nome + '</p>';
          html +=   '<h2>' + stats[i].valor + '</h2>';
          html +=   '<small>' + stats[i].sub + '</small>';
          html += '</div>';
        }
        document.getElementById('gradeStats').innerHTML = html;

        var labelsSemanas = [];
        var listaPresentes = [];
        var listaAusencias = [];

        for (var j = 0; j < dados.presencaPorSemana.length; j++) {
          labelsSemanas.push('Sem ' + dados.presencaPorSemana[j].num_semana);
          listaPresentes.push(dados.presencaPorSemana[j].presentes);
          listaAusencias.push(dados.presencaPorSemana[j].ausencias);
        }

        new Chart(document.getElementById('cPresenca'), {
          type: 'bar',
          data: {
            labels: labelsSemanas.length > 0 ? labelsSemanas : ['Sem dados'],
            datasets: [
              { label: 'Presentes', data: listaPresentes.length > 0 ? listaPresentes : [0], backgroundColor: 'rgba(238,25,25,.8)', borderRadius: 6 },
              { label: 'Ausencias', data: listaAusencias.length > 0 ? listaAusencias : [0], backgroundColor: 'rgba(255,255,255,.08)', borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#a0a0a0' } } },
            scales: {
              x: { ticks: { color: '#a0a0a0' }, stacked: true },
              y: { ticks: { color: '#a0a0a0' }, stacked: true }
            }
          }
        });

        montarGraficoEvolucao(dados.kpis.desempenho);
      })
      .catch(function(erro) {
        console.error('Erro ao carregar metricas do aluno:', erro);
        document.getElementById('gradeStats').innerHTML = '<p style="color:var(--red)">Erro ao carregar estatisticas.</p>';
      });
  }

  function montarGraficoEvolucao(desempenhoAtual) {
    graficoEvolucao = new Chart(document.getElementById('cEvolucao'), {
      type: 'line',
      data: {
        labels: ['Inicial', 'Atual'],
        datasets: [{
          label: 'Nota geral',
          data: [50, desempenhoAtual],
          borderColor: '#ee1919',
          backgroundColor: 'rgba(238,25,25,.1)',
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#ee1919'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#a0a0a0' } } },
        scales: {
          x: { ticks: { color: '#a0a0a0' } },
          y: { ticks: { color: '#a0a0a0' }, min: 0, max: 100 }
        }
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    var user = storage.require('aluno');
    if (!user) return;

    document.getElementById('cardNome').textContent = user.nome || '-';
    document.getElementById('cardCategoria').textContent = user.categoria || '-';

    var primeiroNome = (user.nome || 'Atleta').split(' ')[0];
    document.getElementById('primNome').textContent = primeiroNome;
    document.getElementById('cardPos').textContent = user.posicao || '-';

    carregarMetricasAluno(user.id);
    carregarPeneiras();
  });
</script>
</body>
</html>
