<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Dashboard Atleta</title>
  <!-- tokens.css = estilos globais compartilhados -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- styleDashboardAluno.css = estilos específicos desta página -->
  <link rel="stylesheet" href="css/styleDashboardAluno.css">
</head>
<body>
<div class="layout">

  <!-- ===== MENU LATERAL ===== -->
  <nav class="sidebar">
    <img class="logo" src="../Logo/Next-removebg-preview.png">
    <a href="dashboard-aluno.html" class="sidebar-link active">Dashboard</a>
    <a href="perfil.html"          class="sidebar-link">Perfil</a>
    <a href="peneiras.html"        class="sidebar-link">Peneiras</a>
    <a href="#" class="sidebar-link" onclick="Auth.logout()">Sair</a>
  </nav>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main-content">

    <!-- Chip com avatar e nome do atleta -->
    <div id="userChip" class="user-chip">
      <img id="chipAvatar" src="" alt="Avatar do atleta">
      <div>
        <span id="chipNome">—</span><br>
        <small id="chipCategoria">—</small>
      </div>
    </div>

    <!-- Saudação personalizada -->
    <div class="welcome">Olá, <span id="firstName">Atleta</span>!</div>
    <p class="page-sub">Sua temporada 2026 · <span id="chipPos">—</span></p>

    <!-- ── Cards de estatísticas pessoais ── -->
    <!-- Preenchidos via JavaScript com dados do banco -->
    <div class="stats-grid" id="statsGrid">
      <p style="color:var(--grey)">Carregando estatísticas...</p>
    </div>

    <!-- ── Linha 1 de gráficos ── -->
    <div class="charts-row">
      <div class="chart-box wide">
        <h3>Presença nos treinos — últimas 8 semanas</h3>
        <canvas id="cPresenca"></canvas>
      </div>
      <div class="chart-box">
        <h3>Radar de habilidades</h3>
        <canvas id="cRadar"></canvas>
      </div>
    </div>

    <!-- ── Linha 2: evolução e próximas peneiras ── -->
    <div class="charts-row">
      <div class="chart-box">
        <h3>Evolução de desempenho</h3>
        <canvas id="cEvolucao"></canvas>
      </div>
      <div class="chart-box">
        <h3>Próximas peneiras</h3>
        <!-- Preenchido via JavaScript com dados do banco -->
        <div id="proximasPeneiras">
          <p style="color:var(--grey)">Carregando peneiras...</p>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Chart.js para os gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- utils.js contém Auth, toast, etc. -->
<script src="js/utils.js"></script>
<script>

  // ============================================================
  // Função: carregarPeneiras
  // Busca as peneiras ativas da API GET /peneiras
  // e exibe as próximas na lista
  // ============================================================
  function carregarPeneiras() {
    fetch('/peneiras')
      .then(function(resposta) { return resposta.json(); })
      .then(function(peneiras) {
        var container = document.getElementById('proximasPeneiras');

        if (!peneiras || peneiras.length === 0) {
          container.innerHTML = '<p style="color:var(--grey)">Nenhuma peneira disponível no momento.</p>';
          return;
        }

        // Mostra no máximo as 3 próximas peneiras
        var proximas = peneiras.slice(0, 3);
        var html = '';

        for (var i = 0; i < proximas.length; i++) {
          var p = proximas[i];
          // Formata a data de YYYY-MM-DD para DD/MM/AAAA
          var dataFormatada = p.data_realizacao
            ? p.data_realizacao.split('T')[0].split('-').reverse().join('/')
            : '—';

          html += '<div class="peneira-mini">';
          html +=   '<div class="dot">⚽</div>';
          html +=   '<div>';
          html +=     '<h4>' + (p.nome || '—') + '</h4>';
          html +=     '<p>' + dataFormatada + (p.cidade ? ' · ' + p.cidade : '') + '</p>';
          html +=   '</div>';
          html +=   '<span class="badge badge-green" style="margin-left:auto">aberta</span>';
          html += '</div>';
        }

        container.innerHTML = html;
      })
      .catch(function(erro) {
        console.error('Erro ao carregar peneiras:', erro);
        document.getElementById('proximasPeneiras').innerHTML =
          '<p style="color:var(--red)">Erro ao carregar peneiras.</p>';
      });
  }

  // ============================================================
  // Função: carregarTreinos
  // Busca os treinos do aluno logado e monta os cards de stats
  // e o gráfico de presença
  // Rota: GET /treinos/:idAtleta  (você precisará criar essa rota)
  // Por ora, usa dados do usuário logado para montar os cards
  // ============================================================
  function montarCards(user) {
    var stats = [
      { label: 'Treinos no mês',    val: '—', sub: 'carregando...' },
      { label: '% Presença',        val: '—', sub: 'carregando...' },
      { label: 'Peneiras inscritas', val: '—', sub: 'esta temporada' },
      { label: 'Aprovações',        val: '—', sub: 'confirmadas' }
    ];

    var html = '';
    for (var i = 0; i < stats.length; i++) {
      html += '<div class="stat-card">';
      html +=   '<p>' + stats[i].label + '</p>';
      html +=   '<h2>' + stats[i].val + '</h2>';
      html +=   '<small>' + stats[i].sub + '</small>';
      html += '</div>';
    }
    document.getElementById('statsGrid').innerHTML = html;
  }

  // ============================================================
  // Quando a página termina de carregar, executa tudo
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {

    // Verifica se o usuário está logado como aluno
    var user = Auth.require('aluno');
    if (!user) return;

    // ── Preenche o chip de usuário ──
    var nomeEncoded = encodeURIComponent(user.nome || 'A');
    var avatarUrl = user.foto_perfil ||
      ('https://ui-avatars.com/api/?name=' + nomeEncoded + '&background=ee1919&color=fff&size=32');

    document.getElementById('chipAvatar').src          = avatarUrl;
    document.getElementById('chipNome').textContent    = user.nome || '—';
    document.getElementById('chipCategoria').textContent = user.categoria || '—';

    // Pega só o primeiro nome para a saudação
    var primeiroNome = (user.nome || 'Atleta').split(' ')[0];
    document.getElementById('firstName').textContent = primeiroNome;
    document.getElementById('chipPos').textContent   = user.posicao || '—';

    // ── Monta cards de estatísticas ──
    montarCards(user);

    // ── Busca peneiras da API ──
    carregarPeneiras();

    // ──────────────────────────────────────────────────────────
    // GRÁFICOS
    // Os dados abaixo são exemplos visuais enquanto você não
    // cria rotas de estatísticas pessoais do atleta.
    // Substitua pelos dados reais quando criar esses endpoints.
    // ──────────────────────────────────────────────────────────

    // Gráfico de presença nos treinos (últimas 8 semanas)
    new Chart(document.getElementById('cPresenca'), {
      type: 'bar',
      data: {
        labels: ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4', 'Sem 5', 'Sem 6', 'Sem 7', 'Sem 8'],
        datasets: [
          { label: 'Presentes', data: [3, 3, 2, 3, 3, 3, 2, 3], backgroundColor: 'rgba(238,25,25,.8)', borderRadius: 6 },
          { label: 'Ausências', data: [0, 0, 1, 0, 0, 0, 1, 0], backgroundColor: 'rgba(255,255,255,.08)', borderRadius: 6 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#a0a0a0' } } },
        scales: {
          x: { ticks: { color: '#a0a0a0' }, stacked: true },
          y: { ticks: { color: '#a0a0a0' }, stacked: true }
        }
      }
    });

    // Gráfico radar de habilidades
    new Chart(document.getElementById('cRadar'), {
      type: 'radar',
      data: {
        labels: ['Velocidade', 'Técnica', 'Finalização', 'Passe', 'Drible', 'Posicionamento'],
        datasets: [
          {
            label: 'Você',
            data: [78, 82, 90, 74, 85, 70],
            borderColor: '#ee1919',
            backgroundColor: 'rgba(238,25,25,.15)',
            pointBackgroundColor: '#ee1919'
          },
          {
            label: 'Média categoria',
            data: [70, 70, 70, 70, 70, 70],
            borderColor: 'rgba(255,255,255,.2)',
            backgroundColor: 'transparent',
            borderDash: [4, 4],
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            ticks: { display: false },
            grid: { color: 'rgba(255,255,255,.08)' },
            pointLabels: { color: '#a0a0a0' }
          }
        },
        plugins: { legend: { labels: { color: '#a0a0a0' } } }
      }
    });

    // Gráfico de evolução de desempenho ao longo dos meses
    new Chart(document.getElementById('cEvolucao'), {
      type: 'line',
      data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai'],
        datasets: [{
          label: 'Nota geral',
          data: [65, 70, 72, 80, 85],
          borderColor: '#ee1919',
          backgroundColor: 'rgba(238,25,25,.1)',
          fill: true,
          tension: .4,
          pointBackgroundColor: '#ee1919'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#a0a0a0' } } },
        scales: {
          x: { ticks: { color: '#a0a0a0' } },
          y: { ticks: { color: '#a0a0a0' }, min: 0, max: 100 }
        }
      }
    });

  });

</script>
</body>
</html>
