<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Meus Treinos</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styleTreinos.css">
</head>
<body>
<div class="estrutura">

  <nav class="menu-lateral">
    <img class="logo" src="../Logo/Next-removebg-preview.png" alt="Logo NextGen">
    <a href="dashboard-aluno.html" class="link-menu">Dashboard</a>
    <a href="perfil.html"          class="link-menu">Perfil</a>
    <a href="peneiras.html"        class="link-menu">Peneiras</a>
    <a href="meus-treinos.html"    class="link-menu ativo">Meus Treinos</a>
    <a href="login.html"           class="link-menu" onclick="storage.logout()">Sair</a>
  </nav>

  <main class="conteudo-principal">

    <div class="titulo-pagina">Meus Treinos</div>
    <p class="subtitulo-pagina">Treinos passados pelo seu professor.</p>

    <div style="margin-bottom: 20px;">
      <span class="selo selo-vermelho" id="contadorPendentes">Carregando...</span>
    </div>

    <div class="rotulo-secao">Pendentes</div>
    <div id="listaPendentes">
      <p class="msg-carregando">Carregando treinos...</p>
    </div>

    <div style="margin-top: 32px;" id="secaoConcluidos">
      <div class="rotulo-secao">Concluidos</div>
      <div id="listaConcluidos">
      </div>
    </div>

  </main>
</div>

<script>
  var storage = {
    login: function(user) {
      localStorage.setItem('sessaoUser', JSON.stringify(user));
    },
    logout: function() {
      localStorage.removeItem('sessaoUser');
      window.location.href = 'login.html';
    },
    current: function() {
      try {
        return JSON.parse(localStorage.getItem('sessaoUser')) || null;
      } catch(e) {
        return null;
      }
    }
  };

  function alerta(mensagem, tipo) {
    var tipo_final = tipo || 'sucesso';
    var caixa = document.getElementById('toastContainer');
    if (!caixa) {
      caixa = document.createElement('div');
      caixa.id = 'toastContainer';
      caixa.className = 'caixa-alertas';
      document.body.appendChild(caixa);
    }
    var t = document.createElement('div');
    t.className = 'alerta alerta-' + tipo_final;
    t.innerHTML = '<span>' + (tipo_final === 'sucesso' ? '✓' : '✕') + '</span> ' + mensagem;
    caixa.appendChild(t);
    setTimeout(function() {
      t.remove();
    }, 3200);
  }


  var user = null;

  document.addEventListener('DOMContentLoaded', function() {
    user = storage.current();

    
    if (!user || user.tipo !== 'aluno') {
      window.location.href = 'dashboard-admin.html';
      return;
    }

    carregarTreinos();
  });

  function carregarTreinos() {
    fetch('/treinos/aluno/' + user.id)
      .then(function(r) {
        
        if (r.status === 204) return [];
        return r.json();
      })
      .then(function(treinos) {
        renderizarTreinos(treinos);
      })
      .catch(function() {
        document.getElementById('listaPendentes').innerHTML =
          '<p class="msg-erro">Erro ao carregar treinos. Verifique se o servidor está rodando.</p>';
      });
  }

  function renderizarTreinos(lista) {
    var containerPendentes  = document.getElementById('listaPendentes');
    var containerConcluidos = document.getElementById('listaConcluidos');
    var contador            = document.getElementById('contadorPendentes');

    
    var pendentes  = lista.filter(function(t) { return t.status !== 'concluido'; });
    var concluidos = lista.filter(function(t) { return t.status === 'concluido'; });

    contador.textContent = pendentes.length + (pendentes.length === 1 ? ' pendente' : ' pendentes');

    if (pendentes.length === 0) {
      containerPendentes.innerHTML =
        '<div class="estado-vazio">' +
          '<p>Nenhum treino pendente.</p>' +
          '<p style="font-size:13px; color:#666; margin-top:6px">Fique atento, seu professor pode criar um a qualquer momento.</p>' +
        '</div>';
    } else {
      containerPendentes.innerHTML = montarHtmlCards(pendentes, true);
    }

    
    if (concluidos.length === 0) {
      containerConcluidos.innerHTML = '<p style="color: #555; font-size: 13px;">Nenhum treino concluido ainda.</p>';
    } else {
      containerConcluidos.innerHTML = montarHtmlCards(concluidos, false);
    }
  }

  function montarHtmlCards(lista, mostrarBotaoConcluir) {
    var html = '';

    lista.forEach(function(t) {
      var data = t.criado_em
    ? t.criado_em.split('T')[0].split('-').reverse().join('/')
    : 'sem data';

      var classeCard = t.status === 'concluido' ? 'cartao-treino concluido' : 'cartao-treino';

      html += '<div class="' + classeCard + '" id="treino-' + t.id + '">';
      html +=   '<div class="info-cartao-treino">';
      html +=     '<h4>' + (t.descricao || 'sem descricao') + '</h4>';
      html +=     '<p>Professor: <strong>' + (t.professor_nome || '—') + '</strong></p>';
      html +=     '<p>Passado em: ' + data + '</p>';
      html +=   '</div>';

      html +=   '<div class="acoes-cartao-treino" id="acoes-' + t.id + '">';
      if (mostrarBotaoConcluir) {
        
        html += '<span class="selo selo-amarelo">Pendente</span>';
        html += '<button class="botao botao-concluir" id="btn-' + t.id + '"';
        html += ' onclick="concluirTreino(' + t.id + ')">Marcar como feito</button>';
      } else {
        
        html += '<span class="selo selo-verde">Concluido</span>';
      }
      html +=   '</div>';

      html += '</div>';
    });

    return html;
  }

  function concluirTreino(treinoId) {
    var botao = document.getElementById('btn-' + treinoId);
    
    if (botao) {
      botao.disabled    = true;
      botao.innerHTML = 'Salvando...';
    }

    fetch('/treinos/concluir/' + treinoId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(function(r) { return r.json(); })
    .then(function(dados) {
      if (dados.mensagem === 'Treino concluido!') {
        
        alerta('Treino marcado como feito!');
        carregarTreinos();
      } else {
        alerta('Erro ao concluir treino.', 'erro');
        if (botao) {
          botao.disabled    = false;
          botao.textContent = 'Marcar como feito';
        }
      }
    })
    .catch(function() {
      alerta('Erro ao conectar com o servidor.', 'erro');
      if (botao) {
        botao.disabled    = false;
        botao.textContent = 'Marcar como feito';
      }
    });
  }

</script>
</body>
</html>
