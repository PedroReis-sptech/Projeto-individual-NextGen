<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Criar Peneira</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* card de peneira criada */
    .peneira-card {
      background:var(--bg-3); border:1px solid var(--border);
      border-radius:var(--r); padding:16px 20px;
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:16px; margin-bottom:12px; transition:.2s;
    }
    .peneira-card:hover { border-color:var(--border-red); }
    .peneira-card h4 { font-size:15px; font-weight:600; margin-bottom:4px; }
    .peneira-card p  { font-size:13px; color:var(--grey); margin-bottom:2px; }
    .peneira-card .actions { display:flex; gap:8px; flex-shrink:0; }
    .btn-icon {
      width:34px; height:34px; border-radius:var(--r);
      border:1px solid var(--border); background:transparent;
      color:var(--grey); cursor:pointer; font-size:15px;
      display:flex; align-items:center; justify-content:center;
      transition:.2s;
    }
    .btn-icon:hover { color:var(--red); border-color:var(--border-red); }

    .empty-state {
      text-align:center; padding:48px; color:var(--grey);
      border:1px dashed var(--border); border-radius:var(--r2);
    }
    .empty-state div { font-size:40px; margin-bottom:12px; }

    /* form panel */
    .form-panel {
      background:var(--bg-2); border:1px solid var(--border);
      border-radius:var(--r2); padding:28px;
      margin-bottom:28px;
    }
    .form-panel h2 {
      font-family:var(--font-display); font-size:22px;
      font-weight:800; text-transform:uppercase;
      margin-bottom:22px;
    }
    .btn-row { display:flex; gap:12px; justify-content:flex-end; margin-top:20px; }
  </style>
</head>
<body>
<div class="layout">

  <nav class="sidebar">
    <img class="logo" src="../Logo/Next-removebg-preview.png"
         onerror="this.outerHTML='<div style=\'font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--red);text-align:center;margin-bottom:28px\'>NG</div>'">
    <a href="dashboard-admin.html" class="sidebar-link">Dashboard</a>
    <a href="perfil.html"          class="sidebar-link">Atleta</a>
    <a href="peneiras.html"        class="sidebar-link">Peneiras</a>
    <a href="criar-peneira.html"   class="sidebar-link active">Criar Peneira</a>
    <a href="#" class="sidebar-link" onclick="Auth.logout()">Sair</a>
  </nav>

  <main class="main-content">
    <div class="page-title">Criar Peneira</div>
    <p class="page-sub">Cadastre uma nova peneira para os atletas se inscreverem.</p>

    <!-- Formulário -->
    <div class="form-panel">
      <h2>Nova peneira</h2>
      <div class="form-grid">
        <div class="form-group full">
          <label>Nome da peneira *</label>
          <input id="pNome" required placeholder="Ex: Peneira Sub-17 · Corinthians">
        </div>
        <div class="form-group">
          <label>Data *</label>
          <input id="pData" type="date" required>
        </div>
        <div class="form-group">
          <label>Horário *</label>
          <input id="pHorario" type="time" required>
        </div>
        <div class="form-group">
          <label>Categoria *</label>
          <select id="pCategoria" required>
            <option value="">Selecione</option>
            <option>Sub-11</option><option>Sub-13</option><option>Sub-15</option>
            <option>Sub-17</option><option>Sub-20</option><option>Profissional</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vagas</label>
          <input id="pVagas" type="number" placeholder="30">
        </div>
        <div class="form-group full">
          <label>Local / Endereço *</label>
          <input id="pLocal" required placeholder="Ex: CT Joaquim Grava, São Paulo">
        </div>
        <div class="form-group full">
          <label>Clube</label>
          <select id="pClube">
            <option value="">Selecione um clube (opcional)</option>
            <option>Corinthians</option><option>Palmeiras</option><option>São Paulo FC</option>
            <option>Santos</option><option>Portuguesa</option><option>São Caetano</option>
            <option>Red Bull Bragantino</option><option>Outro</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Descrição</label>
          <textarea id="pDesc" rows="4" placeholder="Descreva os requisitos, o que o atleta deve levar, etc."></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="limparForm()">Limpar</button>
        <button class="btn btn-primary" onclick="criarPeneira()">Criar Peneira →</button>
      </div>
    </div>

    <!-- Lista das peneiras criadas -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h3 style="font-family:var(--font-display);font-size:18px;text-transform:uppercase">Peneiras criadas</h3>
      <span class="badge badge-red" id="totalBadge">0 peneiras</span>
    </div>
    <div id="listaCriadas"></div>
  </main>
</div>

<script src="js/utils.js"></script>
<script>
// Persistência simples em sessionStorage (reset ao fechar aba)
const STORAGE_KEY = 'ng_peneiras_admin';

function loadPeneiras() {
  try { return JSON.parse(sessionStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function savePeneiras(list) {
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function renderPeneiras() {
  const list = loadPeneiras();
  document.getElementById('totalBadge').textContent = `${list.length} peneira${list.length !== 1 ? 's' : ''}`;
  const el = document.getElementById('listaCriadas');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div>📋</div><p>Nenhuma peneira criada ainda.</p></div>`;
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="peneira-card" id="pen-${p.id}">
      <div>
        <h4>${p.nome}</h4>
        <p>📅 ${formatDate(p.data)} às ${p.horario} &nbsp;|&nbsp; 📍 ${p.local}</p>
        <p>🏷 ${p.categoria} &nbsp;${p.clube ? '· 🏟 ' + p.clube : ''} &nbsp;${p.vagas ? '· 👥 ' + p.vagas + ' vagas' : ''}</p>
        ${p.descricao ? `<p style="margin-top:6px;font-size:12px;color:#666">${p.descricao}</p>` : ''}
      </div>
      <div class="actions">
        <span class="badge badge-green">ativa</span>
        <button class="btn-icon" title="Excluir" onclick="excluirPeneira(${p.id})">🗑</button>
      </div>
    </div>`).join('');
}

function formatDate(d) {
  if (!d) return '—';
  const [y,m,dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}

function criarPeneira() {
  const nome     = document.getElementById('pNome').value.trim();
  const data     = document.getElementById('pData').value;
  const horario  = document.getElementById('pHorario').value;
  const categoria= document.getElementById('pCategoria').value;
  const local    = document.getElementById('pLocal').value.trim();

  if (!nome || !data || !horario || !categoria || !local) {
    toast('Preencha todos os campos obrigatórios.', 'error');
    return;
  }

  const nova = {
    id:       Date.now(),
    nome, data, horario, categoria, local,
    vagas:    document.getElementById('pVagas').value,
    clube:    document.getElementById('pClube').value,
    descricao:document.getElementById('pDesc').value.trim(),
  };

  const list = loadPeneiras();
  list.unshift(nova);
  savePeneiras(list);
  renderPeneiras();
  limparForm();
  toast('Peneira criada com sucesso!');
}

function excluirPeneira(id) {
  if (!confirm('Excluir esta peneira?')) return;
  savePeneiras(loadPeneiras().filter(p => p.id !== id));
  renderPeneiras();
  toast('Peneira removida.');
}

function limparForm() {
  ['pNome','pData','pHorario','pVagas','pLocal','pDesc'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('pCategoria').value = '';
  document.getElementById('pClube').value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.current();
  if (!user || user.tipo === 'aluno') { window.location.href='dashboard-aluno.html'; return; }
  renderPeneiras();
});
</script>
</body>
</html>
