<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Criar Peneira</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styleCriarPeneira.css">
</head>

<body>
  <div class="estrutura">

    <nav class="menu-lateral">
      <img class="logo" src="../Logo/Next-removebg-preview.png"
        onerror="this.outerHTML='<div style=\'font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--red);text-align:center;margin-bottom:28px\'>NG</div>'">
      <a href="dashboard-admin.html" class="link-menu">Dashboard</a>
      <a href="perfil.html" class="link-menu">Perfil</a>
      <a href="peneiras.html" class="link-menu">Peneiras</a>
      <a href="criar-peneira.html" class="link-menu ativo">Criar Peneira</a>
      <a href="treinos-professor.html" class="link-menu">Criar Treino</a>
      <a href="#" class="link-menu" onclick="storage.logout()">Sair</a>
    </nav>

    <main class="conteudo-principal">
      <div class="titulo-pagina">Criar Peneira</div>
      <p class="subtitulo-pagina">Cadastre uma nova peneira para os atletas se inscreverem.</p>

      <div class="painel-form">
        <h2>Nova peneira</h2>
        <div class="grade-form">

          <div class="grupo-form completo">
            <label>Nome da peneira *</label>
            <input id="pNome" required placeholder="Ex: Peneira Sub-17 · Corinthians">
          </div>
          <div class="grupo-form">
            <label>Data *</label>
            <input id="pData" type="date" required>
          </div>
          <div class="grupo-form">
            <label>Horário *</label>
            <input id="pHorario" type="time" required>
          </div>
          <div class="grupo-form">
            <label>Categoria *</label>
            <select id="pCategoria" required>
              <option value="">Selecione</option>
              <option>Sub-11</option>
              <option>Sub-13</option>
              <option>Sub-15</option>
              <option>Sub-17</option>
              <option>Sub-20</option>
              <option>Profissional</option>
            </select>
          </div>
          <div class="grupo-form">
            <label>Vagas</label>
            <input id="pVagas" type="number" placeholder="30">
          </div>
          <div class="grupo-form completo">
            <label>Local / Endereço *</label>
            <input id="pLocal" required placeholder="Ex: CT Joaquim Grava, São Paulo">
          </div>
          <div class="grupo-form completo">
            <label>Cidade</label>
            <input id="pCidade" placeholder="Ex: São Paulo">
          </div>
          <div class="grupo-form completo">
            <label>Clube</label>
            <input id="pClube" placeholder="Ex: Corinthians, Palmeiras, Outro...">
          </div>
          <div class="grupo-form completo">
            <label>Descrição</label>
            <textarea id="pDesc" rows="4"
              placeholder="Descreva os requisitos, o que o atleta deve levar, etc."></textarea>
          </div>

        </div>
        <div class="linha-botoes">
          <button class="botao botao-transparente" onclick="limparForm()">Limpar</button>
          <button class="botao botao-principal" onclick="criarPeneira()">Criar Peneira →</button>
        </div>
      </div>

      <div class="cabecalho-lista">
        <h3 class="lista-titulo">Peneiras criadas</h3>
        <span class="selo selo-vermelho" id="totalBadge">0 peneiras</span>
      </div>
      <div id="listaCriadas">
      </div>

    </main>
  </div>

  <script>
    var storage = {
      login: function(user) {
        localStorage.setItem('sessaoUser', JSON.stringify(user));
      },
      logout: function() {
        localStorage.removeItem('sessaoUser');
        window.location.href = 'login.html';
      },
      current: function() {
        try {
          return JSON.parse(localStorage.getItem('sessaoUser')) || null;
        } catch(e) {
          return null;
        }
      },
      require: function(tipo) {
        var u = this.current();
        if (!u) {
          window.location.href = 'login.html';
          return null;
        }
        if (tipo && u.tipo !== tipo) {
          window.location.href = u.tipo === 'aluno' ? 'dashboard-aluno.html' : 'dashboard-admin.html';
          return null;
        }
        return u;
      }
    };

    function renderPeneiras(lista) {
      var caixa = document.getElementById('listaCriadas');
      var selo = document.getElementById('totalBadge');

      selo.textContent = lista.length + ' peneira' + (lista.length !== 1 ? 's' : '');

      if (!lista || lista.length === 0) {
        caixa.innerHTML =
          '<div class="estado-vazio"><p>Nenhuma peneira criada ainda.</p></div>';
        return;
      }

      var html = '';
    for (var i = 0; i < lista.length; i++) {
      var p = lista[i];
      var dataFormatada = p.data_realizacao
        ? p.data_realizacao.split('T')[0].split('-').reverse().join('/')
        : '—';

      var badgeClass = 'selo-verde';
      var badgeTexto = 'ativa';
      
      if (p.status === 'desativada' || p.ativo === false) {
        badgeClass = 'selo-vermelho';
        badgeTexto = 'desativada';
      }

      html += '<div class="cartao-peneira" id="pen-' + p.id + '">';
      html +=   '<div>';
      html +=     '<h4>' + (p.nome || '—') + '</h4>';
      html +=     dataFormatada + (p.horario ? ' às ' + p.horario : '') + '</p>';
      html +=     (p.local_endereco || p.cidade || '—') + '</p>';
      html +=     (p.categoria || '—') + (p.vagas ? ' · 👥 ' + p.vagas + ' vagas' : '') + '</p>';
      if (p.descricao) {
        html +=   '<p class="descricao-peneira">' + p.descricao + '</p>';
      }
      html +=   '</div>';
      html +=   '<div class="acoes">';
      html +=     '<span class="selo ' + badgeClass + '">' + badgeTexto + '</span>';

      if (badgeTexto === 'ativa') {
        html +=     '<button class="botao-icone" title="Desativar" onclick="desativarPeneira(' + p.id + ')">🗑</button>';
      }
      
      html +=   '</div>';
      html += '</div>';
    }
      caixa.innerHTML = html;
    }

    function carregarPeneiras() {
      var user = storage.current();
      if (!user) return;

      fetch('/peneiras/criador/' + user.id)
        .then(function (resposta) { return resposta.json(); })
        .then(function (dados) {
          renderPeneiras(dados);
        })
        .catch(function (erro) {
          console.error('Erro ao carregar peneiras:', erro);
          document.getElementById('listaCriadas').innerHTML =
            '<p style="color:var(--red)">Erro ao carregar. Verifique o servidor.</p>';
        });
    }

    function criarPeneira() {
      var nome = document.getElementById('pNome').value.trim();
      var data = document.getElementById('pData').value;
      var horario = document.getElementById('pHorario').value;
      var categoria = document.getElementById('pCategoria').value;
      var local     = document.getElementById('pLocal').value.trim();
      var clube     = document.getElementById('pClube').value.trim();

      
      if (!nome || !data || !horario || !categoria || !local) {
        alert('Preencha todos os campos obrigatórios.', 'erro');
        return;
      }

      var user = storage.current();
      if (!user) return;

      fetch('/peneiras/criar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nome:            nome,
      dataRealizacao:  data,
      horario:         horario,
      categoria:       categoria,
      localEndereco:   local,
      cidade:          document.getElementById('pCidade').value,
      vagas:           document.getElementById('pVagas').value,
      clube:           clube,
      descricao:       document.getElementById('pDesc').value.trim(),
      fkCriador:       user.id
    })
  })
        .then(function (resposta) { return resposta.json(); })
        .then(function (resultado) {
          if (resultado.mensagem && !resultado.id) {
            alert(resultado.mensagem, 'erro');
            return;
          }
          alert('Peneira criada com sucesso!');
          limparForm();
          carregarPeneiras(); 
        })
        .catch(function (erro) {
          console.error('Erro ao criar peneira:', erro);
          alert('Erro ao conectar com o servidor.', 'erro');
        });
    }

    function desativarPeneira(id) {
      if (!confirm('Desativar esta peneira?')) return;

      fetch('/peneiras/desativar/' + id, { method: 'DELETE' })
        .then(function (resposta) { return resposta.json(); })
        .then(function () {
          alert('Peneira desativada.');
          carregarPeneiras(); 
        })
        .catch(function (erro) {
          console.error('Erro ao desativar:', erro);
          alert('Erro ao desativar a peneira.', 'erro');
        });
    }


    function limparForm() {
      var campos = ['pNome', 'pData', 'pHorario', 'pVagas', 'pLocal', 'pCidade', 'pDesc'];
      for (var i = 0; i < campos.length; i++) {
        document.getElementById(campos[i]).value = '';
      }
      document.getElementById('pCategoria').value = '';
      document.getElementById('pClube').value = '';
    }

    document.addEventListener('DOMContentLoaded', function () {
      var user = storage.current();
      
      if (!user || user.tipo === 'aluno') {
        window.location.href = 'dashboard-aluno.html';
        return;
      }
      carregarPeneiras();
    });

  </script>
</body>

</html>
