<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Criar Peneira</title>
  <!-- tokens.css = estilos globais compartilhados -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- styleCriarPeneira.css = estilos específicos desta página -->
  <link rel="stylesheet" href="css/styleCriarPeneira.css">
</head>
<body>
<div class="layout">

  <!-- ===== MENU LATERAL ===== -->
  <nav class="sidebar">
    <img class="logo" src="../Logo/Next-removebg-preview.png"
         onerror="this.outerHTML='<div style=\'font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--red);text-align:center;margin-bottom:28px\'>NG</div>'">
    <a href="dashboard-admin.html" class="sidebar-link">Dashboard</a>
    <a href="perfil.html"          class="sidebar-link">Perfil</a>
    <a href="peneiras.html"        class="sidebar-link">Peneiras</a>
    <a href="criar-peneira.html"   class="sidebar-link active">Criar Peneira</a>
    <a href="#" class="sidebar-link" onclick="Auth.logout()">Sair</a>
  </nav>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main-content">
    <div class="page-title">Criar Peneira</div>
    <p class="page-sub">Cadastre uma nova peneira para os atletas se inscreverem.</p>

    <!-- ===== FORMULÁRIO DE CRIAÇÃO ===== -->
    <div class="form-panel">
      <h2>Nova peneira</h2>
      <div class="form-grid">

        <div class="form-group full">
          <label>Nome da peneira *</label>
          <input id="pNome" required placeholder="Ex: Peneira Sub-17 · Corinthians">
        </div>
        <div class="form-group">
          <label>Data *</label>
          <input id="pData" type="date" required>
        </div>
        <div class="form-group">
          <label>Horário *</label>
          <input id="pHorario" type="time" required>
        </div>
        <div class="form-group">
          <label>Categoria *</label>
          <select id="pCategoria" required>
            <option value="">Selecione</option>
            <option>Sub-11</option><option>Sub-13</option><option>Sub-15</option>
            <option>Sub-17</option><option>Sub-20</option><option>Profissional</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vagas</label>
          <input id="pVagas" type="number" placeholder="30">
        </div>
        <div class="form-group full">
          <label>Local / Endereço *</label>
          <input id="pLocal" required placeholder="Ex: CT Joaquim Grava, São Paulo">
        </div>
        <div class="form-group full">
          <label>Cidade</label>
          <input id="pCidade" placeholder="Ex: São Paulo">
        </div>
        <div class="form-group full">
          <label>Clube</label>
          <select id="pClube">
            <option value="">Selecione um clube (opcional)</option>
            <option>Corinthians</option><option>Palmeiras</option>
            <option>São Paulo FC</option><option>Santos</option>
            <option>Portuguesa</option><option>São Caetano</option>
            <option>Red Bull Bragantino</option><option>Outro</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Descrição</label>
          <textarea id="pDesc" rows="4" placeholder="Descreva os requisitos, o que o atleta deve levar, etc."></textarea>
        </div>

      </div>
      <div class="btn-row">
        <button class="btn btn-ghost"   onclick="limparForm()">Limpar</button>
        <button class="btn btn-primary" onclick="criarPeneira()">Criar Peneira →</button>
      </div>
    </div>

    <!-- ===== LISTA DE PENEIRAS JÁ CRIADAS ===== -->
    <div class="lista-header">
      <h3 class="lista-titulo">Peneiras criadas</h3>
      <span class="badge badge-red" id="totalBadge">0 peneiras</span>
    </div>
    <!-- Preenchido pela API via JavaScript -->
    <div id="listaCriadas">
      <p style="color:var(--grey)">Carregando peneiras...</p>
    </div>

  </main>
</div>

<!-- utils.js contém Auth, toast, etc. -->
<script src="js/utils.js"></script>
<script>

  // ============================================================
  // Função: renderPeneiras
  // Recebe uma lista de peneiras e monta o HTML da lista
  // ============================================================
  function renderPeneiras(lista) {
    var container = document.getElementById('listaCriadas');
    var badge     = document.getElementById('totalBadge');

    badge.textContent = lista.length + ' peneira' + (lista.length !== 1 ? 's' : '');

    if (!lista || lista.length === 0) {
      container.innerHTML =
        '<div class="empty-state"><div>📋</div><p>Nenhuma peneira criada ainda.</p></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < lista.length; i++) {
      var p = lista[i];
      // Formata a data de YYYY-MM-DD para DD/MM/AAAA
      var dataFormatada = p.data_realizacao
        ? p.data_realizacao.split('T')[0].split('-').reverse().join('/')
        : '—';

      html += '<div class="peneira-card" id="pen-' + p.id + '">';
      html +=   '<div>';
      html +=     '<h4>' + (p.nome || '—') + '</h4>';
      html +=     '<p>📅 ' + dataFormatada + (p.horario ? ' às ' + p.horario : '') + '</p>';
      html +=     '<p>📍 ' + (p.local_endereco || p.cidade || '—') + '</p>';
      html +=     '<p>🏷 ' + (p.categoria || '—') + (p.vagas ? ' · 👥 ' + p.vagas + ' vagas' : '') + '</p>';
      if (p.descricao) {
        html +=   '<p class="desc-peneira">' + p.descricao + '</p>';
      }
      html +=   '</div>';
      html +=   '<div class="actions">';
      html +=     '<span class="badge badge-green">ativa</span>';
      html +=     '<button class="btn-icon" title="Desativar" onclick="desativarPeneira(' + p.id + ')">🗑</button>';
      html +=   '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  // ============================================================
  // Função: carregarPeneiras
  // Busca as peneiras criadas pelo usuário logado via API
  // GET /peneiras/criador/:idCriador
  // ============================================================
  function carregarPeneiras() {
    var user = Auth.current();
    if (!user) return;

    fetch('/peneiras/criador/' + user.id)
      .then(function(resposta) { return resposta.json(); })
      .then(function(dados) {
        renderPeneiras(dados);
      })
      .catch(function(erro) {
        console.error('Erro ao carregar peneiras:', erro);
        document.getElementById('listaCriadas').innerHTML =
          '<p style="color:var(--red)">Erro ao carregar. Verifique o servidor.</p>';
      });
  }

  // ============================================================
  // Função: criarPeneira
  // Envia os dados do formulário para POST /peneiras/criar
  // ============================================================
  function criarPeneira() {
    var nome      = document.getElementById('pNome').value.trim();
    var data      = document.getElementById('pData').value;
    var horario   = document.getElementById('pHorario').value;
    var categoria = document.getElementById('pCategoria').value;
    var local     = document.getElementById('pLocal').value.trim();

    // Validação dos campos obrigatórios
    if (!nome || !data || !horario || !categoria || !local) {
      toast('Preencha todos os campos obrigatórios.', 'error');
      return;
    }

    var user = Auth.current();
    if (!user) return;

    // Chama a API real do servidor Node.js
    fetch('/peneiras/criar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome:            nome,
        dataRealizacao:  data,
        horario:         horario,
        categoria:       categoria,
        localEndereco:   local,
        cidade:          document.getElementById('pCidade').value,
        vagas:           document.getElementById('pVagas').value,
        descricao:       document.getElementById('pDesc').value.trim(),
        fkCriador:       user.id
      })
    })
    .then(function(resposta) { return resposta.json(); })
    .then(function(resultado) {
      if (resultado.mensagem && !resultado.id) {
        toast(resultado.mensagem, 'error');
        return;
      }
      toast('Peneira criada com sucesso!');
      limparForm();
      carregarPeneiras(); // Recarrega a lista
    })
    .catch(function(erro) {
      console.error('Erro ao criar peneira:', erro);
      toast('Erro ao conectar com o servidor.', 'error');
    });
  }

  // ============================================================
  // Função: desativarPeneira
  // Chama DELETE /peneiras/desativar/:id para desativar
  // ============================================================
  function desativarPeneira(id) {
    if (!confirm('Desativar esta peneira?')) return;

    fetch('/peneiras/desativar/' + id, { method: 'DELETE' })
      .then(function(resposta) { return resposta.json(); })
      .then(function() {
        toast('Peneira desativada.');
        carregarPeneiras(); // Recarrega a lista
      })
      .catch(function(erro) {
        console.error('Erro ao desativar:', erro);
        toast('Erro ao desativar a peneira.', 'error');
      });
  }

  // ============================================================
  // Função: limparForm
  // Limpa todos os campos do formulário
  // ============================================================
  function limparForm() {
    var campos = ['pNome', 'pData', 'pHorario', 'pVagas', 'pLocal', 'pCidade', 'pDesc'];
    for (var i = 0; i < campos.length; i++) {
      document.getElementById(campos[i]).value = '';
    }
    document.getElementById('pCategoria').value = '';
    document.getElementById('pClube').value     = '';
  }

  // ============================================================
  // Quando a página termina de carregar, executa tudo
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    var user = Auth.current();
    // Redireciona alunos de volta para o dashboard deles
    if (!user || user.tipo === 'aluno') {
      window.location.href = 'dashboard-aluno.html';
      return;
    }
    // Carrega as peneiras do criador logado
    carregarPeneiras();
  });

</script>
</body>
</html>
