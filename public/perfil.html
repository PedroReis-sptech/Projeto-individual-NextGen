<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Meu Perfil</title>
  <!-- tokens.css = estilos globais compartilhados -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- stylePerfil.css = estilos específicos desta página -->
  <link rel="stylesheet" href="css/stylePerfil.css">
</head>
<body>
<div class="layout">

  <!-- ===== MENU LATERAL ===== -->
  <!-- Preenchido dinamicamente pelo JavaScript abaixo -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main-content">

    <!-- Herói do perfil: avatar + nome + badges -->
    <div class="profile-hero">
      <div class="avatar-wrap">
        <img id="avatarPreview" class="avatar-img"
             src="https://ui-avatars.com/api/?name=Atleta&background=ee1919&color=fff&size=110"
             alt="Foto de perfil">
        <!-- Input de arquivo oculto -->
        <input type="file" id="avatarInput" accept="image/*">
      </div>
      <div class="hero-info">
        <h2 id="heroNome"></h2>
        <p  id="heroEmail"></p>
        <div class="hero-badges" id="heroBadges"></div>
      </div>
    </div>

    <!-- Navegação por abas -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('dados',  this)">Meus Dados</button>
      <button class="tab-btn"        onclick="switchTab('historico', this)">Histórico</button>
    </div>

    <!-- ===== ABA: MEUS DADOS ===== -->
    <div class="tab-panel visible" id="tab-dados">
      <div class="card">

        <div class="section-title">Informações Pessoais</div>
        <div class="form-grid">
          <div class="form-group"><label>Nome *</label>            <input id="fNome"  required></div>
          <div class="form-group"><label>Login (e-mail) *</label>  <input id="fEmail" type="email" required></div>
          <div class="form-group"><label>Nova senha</label>        <input id="fSenha"  type="password" placeholder="Deixe em branco para manter"></div>
          <div class="form-group"><label>Confirmar senha</label>   <input id="fSenha2" type="password" placeholder="Repita a senha"></div>
          <div class="form-group"><label>Data de nascimento</label><input id="fNasc"   type="date"></div>
          <div class="form-group"><label>Cidade</label>            <input id="fCidade" placeholder="Ex: São Paulo"></div>
        </div>

        <div class="section-title">Informações Esportivas</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Posição *</label>
            <select id="fPosicao" required>
              <option value="">Selecione</option>
              <option>Goleiro</option><option>Zagueiro</option><option>Lateral</option>
              <option>Volante</option><option>Meia</option><option>Atacante</option>
            </select>
          </div>
          <div class="form-group">
            <label>Categoria *</label>
            <select id="fCategoria" required>
              <option value="">Selecione</option>
              <option>Sub-11</option><option>Sub-13</option><option>Sub-15</option>
              <option>Sub-17</option><option>Sub-20</option><option>Profissional</option>
            </select>
          </div>
          <div class="form-group full"><label>Time do coração</label><input id="fTime"   placeholder="Ex: Corinthians"></div>
          <div class="form-group">     <label>Altura (cm)</label>   <input id="fAltura" type="number" placeholder="175"></div>
          <div class="form-group">     <label>Peso (kg)</label>     <input id="fPeso"   type="number" placeholder="68"></div>
        </div>

        <div class="btn-row">
          <button class="btn btn-ghost"   onclick="cancelar()">Cancelar</button>
          <button class="btn btn-primary" onclick="salvar()">Salvar alterações</button>
        </div>
      </div>
    </div>


    <!-- ===== ABA: HISTÓRICO ===== -->
    <div class="tab-panel" id="tab-historico">
      <h3 class="historico-titulo">Peneiras inscritas</h3>
      <!-- Preenchido pela API via JavaScript -->
      <div id="listaPeneiras">
        <p style="color:var(--grey)">Carregando histórico...</p>
      </div>
    </div>

  </main>
</div>

<!-- Chart.js para os gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- utils.js contém Auth, toast, initAvatarUpload, etc. -->
<script src="js/utils.js"></script>
<script>

  // ============================================================
  // Função: buildSidebar
  // Monta o menu lateral de acordo com o tipo do usuário logado
  // ============================================================
  function buildSidebar(tipo) {
    var links;

    if (tipo === 'aluno') {
      links = [
        { href: 'dashboard-aluno.html', label: 'Dashboard' },
        { href: 'perfil.html',          label: 'Perfil',    ativo: true },
        { href: 'peneiras.html',        label: 'Peneiras' },
        { href: 'login.html',           label: 'Sair' }
      ];
    } else {
      links = [
        { href: 'dashboard-admin.html', label: 'Dashboard' },
        { href: 'perfil.html',          label: 'Perfil',         ativo: true },
        { href: 'peneiras.html',        label: 'Peneiras' },
        { href: 'criar-peneira.html',   label: 'Criar Peneira' },
        { href: 'login.html',           label: 'Sair' }
      ];
    }

    var sidebar = document.getElementById('sidebar');
    var html = '<img class="logo" src="../Logo/Next-removebg-preview.png">';
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      html += '<a href="' + l.href + '" class="sidebar-link' + (l.ativo ? ' active' : '') + '">' + l.label + '</a>';
    }
    sidebar.innerHTML = html;
  }

  // ============================================================
  // Função: carregarHistoricoPeneiras
  // Busca as inscrições do aluno logado via API
  // (Você precisará criar a rota GET /inscricoes/:idAtleta)
  // ============================================================
  function carregarHistoricoPeneiras(idAtleta) {
    // Por enquanto mostra mensagem enquanto a rota não está criada
    var container = document.getElementById('listaPeneiras');
    container.innerHTML = '<p style="color:var(--grey)">Histórico de inscrições em desenvolvimento. Crie a rota GET /inscricoes/:idAtleta para ativar.</p>';

    // Quando criar a rota, descomente o código abaixo:

    fetch('/inscricoes/' + idAtleta)
      .then(function(resposta) { return resposta.json(); })
      .then(function(inscricoes) {
        var html = '';
        for (var i = 0; i < inscricoes.length; i++) {
          var ins = inscricoes[i];
          html += '<div class="peneira-item">';
          html +=   '<div><h4>' + ins.nome_peneira + '</h4><p>' + ins.data_realizacao + '</p></div>';
          html +=   '<span class="badge badge-' + (ins.status === 'aprovado' ? 'green' : 'yellow') + '">' + ins.status + '</span>';
          html += '</div>';
        }
        container.innerHTML = html || '<p style="color:var(--grey)">Nenhuma inscrição encontrada.</p>';
      })
      .catch(function(erro) { console.error(erro); });

  }

  // ============================================================
  // Quando a página termina de carregar, executa tudo
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {

    // Verifica se há usuário logado
    var user = Auth.current();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    // Monta o menu lateral
    buildSidebar(user.tipo);

    // Ativa o preview de troca de foto
    initAvatarUpload('avatarInput', 'avatarPreview');

    // ── Preenche o herói com dados do usuário ──
    document.getElementById('heroNome').textContent  = user.nome  || '—';
    document.getElementById('heroEmail').textContent = user.email || '—';

    if (user.foto_perfil) {
      document.getElementById('avatarPreview').src = user.foto_perfil;
    } else {
      document.getElementById('avatarPreview').src =
        'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.nome || 'A') + '&background=ee1919&color=fff&size=110';
    }

    var badges = document.getElementById('heroBadges');
    if (user.posicao)      badges.innerHTML += '<span class="badge badge-red">'    + user.posicao      + '</span>';
    if (user.categoria)    badges.innerHTML += '<span class="badge badge-blue">'   + user.categoria    + '</span>';
    if (user.time_coracao) badges.innerHTML += '<span class="badge badge-yellow">❤ ' + user.time_coracao + '</span>';

    // ── Preenche os campos do formulário ──
    function preencher(id, valor) {
      var campo = document.getElementById(id);
      if (campo && valor) campo.value = valor;
    }
    preencher('fNome',     user.nome);
    preencher('fEmail',    user.email);
    preencher('fNasc',     user.data_nascimento);
    preencher('fCidade',   user.cidade);
    preencher('fPosicao',  user.posicao);
    preencher('fCategoria',user.categoria);
    preencher('fTime',     user.time_coracao);
    preencher('fAltura',   user.altura_cm);
    preencher('fPeso',     user.peso_kg);


    // ── Gráfico de presença ──
    new Chart(document.getElementById('chartPresenca'), {
      type: 'bar',
      data: {
        labels: ['S1','S2','S3','S4','S5','S6','S7','S8','S9','S10','S11','S12'],
        datasets: [{
          label: 'Presença',
          data: [3, 2, 3, 3, 2, 3, 2, 3, 3, 3, 2, 3],
          backgroundColor: 'rgba(238,25,25,.7)',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#a0a0a0' } } },
        scales: { x: { ticks: { color: '#a0a0a0' } }, y: { ticks: { color: '#a0a0a0' }, max: 4 } }
      }
    });

    // ── Gráfico radar de habilidades ──
    new Chart(document.getElementById('chartHabilidade'), {
      type: 'radar',
      data: {
        labels: ['Velocidade', 'Técnica', 'Finalização', 'Passe', 'Drible', 'Posicionamento'],
        datasets: [{
          label: 'Desempenho',
          data: [78, 82, 90, 74, 85, 70],
          borderColor: '#ee1919',
          backgroundColor: 'rgba(238,25,25,.15)',
          pointBackgroundColor: '#ee1919'
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            ticks: { color: '#555', display: false },
            grid: { color: 'rgba(255,255,255,.08)' },
            pointLabels: { color: '#a0a0a0' }
          }
        },
        plugins: { legend: { labels: { color: '#a0a0a0' } } }
      }
    });

    // ── Carrega histórico de peneiras ──
    carregarHistoricoPeneiras(user.id);

  }); // fim DOMContentLoaded

  // ============================================================
  // Função: switchTab
  // Troca a aba visível quando o usuário clica nos botões
  // ============================================================
  function switchTab(nome, botaoClicado) {
    // Esconde todos os painéis e desativa todos os botões
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('visible'); });
    document.querySelectorAll('.tab-btn').forEach(function(b)   { b.classList.remove('active');  });
    // Mostra o painel e ativa o botão clicado
    document.getElementById('tab-' + nome).classList.add('visible');
    botaoClicado.classList.add('active');
  }

  // ============================================================
  // Função: salvar
  // Salva as alterações do perfil via PUT /usuarios/:id/perfil
  // ============================================================
  function salvar() {
    var senha  = document.getElementById('fSenha').value;
    var senha2 = document.getElementById('fSenha2').value;

    // Valida senhas iguais antes de enviar
    if (senha && senha !== senha2) {
      toast('As senhas não coincidem.', 'error');
      return;
    }

    var user = Auth.current();

    // Monta o objeto com os novos dados
    var dadosAtualizados = {
      nome:            document.getElementById('fNome').value    || user.nome,
      email:           document.getElementById('fEmail').value   || user.email,
      data_nascimento: document.getElementById('fNasc').value,
      cidade:          document.getElementById('fCidade').value,
      posicao:         document.getElementById('fPosicao').value,
      categoria:       document.getElementById('fCategoria').value,
      time_coracao:    document.getElementById('fTime').value,
      altura_cm:       document.getElementById('fAltura').value,
      peso_kg:         document.getElementById('fPeso').value
    };
    if (senha) dadosAtualizados.senha = senha;

    // Chama a API real para persistir no banco
    fetch('/usuarios/' + user.id + '/perfil', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dadosAtualizados)
    })
    .then(function(resposta) { return resposta.json(); })
    .then(function(resultado) {
      // Atualiza também a sessão local
      Object.assign(user, dadosAtualizados);

      // Salva foto de perfil se foi trocada
      var img = document.getElementById('avatarPreview');
      if (img.src && !img.src.includes('ui-avatars')) {
        user.foto_perfil = img.src;
      }

      Auth.login(user);
      toast('Perfil atualizado com sucesso!');

      // Atualiza o herói
      document.getElementById('heroNome').textContent  = user.nome;
      document.getElementById('heroEmail').textContent = user.email;
    })
    .catch(function(erro) {
      console.error('Erro ao salvar perfil:', erro);
      toast('Erro ao salvar. Verifique o servidor.', 'error');
    });
  }

  // ============================================================
  // Função: cancelar
  // Recarrega a página para descartar alterações não salvas
  // ============================================================
  function cancelar() {
    location.reload();
  }

</script>
</body>
</html>
