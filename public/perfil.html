<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Meu Perfil</title>
  <!-- tokens.css = estilos globais compartilhados -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- stylePerfil.css = estilos específicos desta página -->
  <link rel="stylesheet" href="css/stylePerfil.css">
</head>
<body>
<div class="estrutura">

  <div class="menu-lateral" id="menu-lateral"></div>

  <main class="conteudo-principal">

    <div class="destaque-perfil">
      <div class="caixa-avatar">
      </div>
      <div class="info-destaque">
        <h2 id="heroNome"></h2>
        <p  id="heroEmail"></p>
        <div class="selos-destaque" id="heroBadges"></div>
      </div>
    </div>

      <div class="aba-dados">Meus Dados</div>

    <div class="painel-aba visivel" id="tab-dados">
      <div class="cartao">

        <div class="titulo-secao">Informações Pessoais</div>
        <div class="grade-form">
          <div class="grupo-form"><label>Nome *</label>            <input id="fNome"  required></div>
          <div class="grupo-form"><label>Login (e-mail) *</label>  <input id="fEmail" type="email" required></div>
          <div class="grupo-form"><label>Nova senha</label>        <input id="fSenha"  type="password" placeholder="Deixe em branco para manter"></div>
          <div class="grupo-form"><label>Confirmar senha</label>   <input id="fSenha2" type="password" placeholder="Repita a senha"></div>
          <div class="grupo-form"><label>Data de nascimento</label><input id="fNasc"   type="date"></div>
          <div class="grupo-form"><label>Cidade</label>            <input id="fCidade" placeholder="Ex: São Paulo"></div>
        </div>

        <div class="titulo-secao">Informações Esportivas</div>
        <div class="grade-form">
          <div class="grupo-form">
            <label>Posição *</label>
            <select id="fPosicao" required>
              <option value="">Selecione</option>
              <option>Goleiro</option><option>Zagueiro</option><option>Lateral</option>
              <option>Volante</option><option>Meia</option><option>Atacante</option>
            </select>
          </div>
          <div class="grupo-form">
            <label>Categoria *</label>
            <select id="fCategoria" required>
              <option value="">Selecione</option>
              <option>Sub-11</option><option>Sub-13</option><option>Sub-15</option>
              <option>Sub-17</option><option>Sub-20</option><option>Profissional</option>
            </select>
          </div>
          <div class="grupo-form completo"><label>Time do coração</label><input id="fTime"   placeholder="Ex: Corinthians"></div>
          <div class="grupo-form">     <label>Altura (cm)</label>   <input id="fAltura" type="number" placeholder="175"></div>
          <div class="grupo-form">     <label>Peso (kg)</label>     <input id="fPeso"   type="number" placeholder="68"></div>
        </div>

        <div class="linha-botoes">
          <button class="botao botao-transparente"   onclick="cancelar()">Cancelar</button>
          <button class="botao botao-principal" onclick="salvar()">Salvar alterações</button>
        </div>
      </div>
    </div>
      <div id="historicoPeneiras">
    </div>

  </main>
</div>

<script>
  var storage = {
    login: function(user) {
      localStorage.setItem('sessaoUser', JSON.stringify(user));
    },
    logout: function() {
      localStorage.removeItem('sessaoUser');
      window.location.href = 'login.html';
    },
    current: function() {
      try {
        return JSON.parse(localStorage.getItem('sessaoUser')) || null;
      } catch(e) {
        return null;
      }
    }
  };

  function alerta(mensagem, tipo) {
    var tipo_final = tipo || 'sucesso';
    var caixa = document.getElementById('toastContainer');
    if (!caixa) {
      caixa = document.createElement('div');
      caixa.id = 'toastContainer';
      caixa.className = 'caixa-alertas';
      document.body.appendChild(caixa);
    }
    var t = document.createElement('div');
    t.className = 'alerta alerta-' + tipo_final;
    t.innerHTML = '<span>' + (tipo_final === 'sucesso' ? '✓' : '✕') + '</span> ' + mensagem;
    caixa.appendChild(t);
    setTimeout(function() {
      t.remove();
    }, 3200);
  }


  function buildSidebar(tipo) {
    var links;

    if (tipo === 'aluno') {
      links = [
        { href: 'dashboard-aluno.html', label: 'Dashboard' },
        { href: 'perfil.html',          label: 'Perfil',    ativo: true },
        { href: 'peneiras.html',        label: 'Peneiras' },
        { href: 'meus-treinos.html',    label: 'Meus Treinos' },
        { href: 'login.html',           label: 'Sair' }
      ];
    } else {
      links = [
        { href: 'dashboard-admin.html', label: 'Dashboard' },
        { href: 'perfil.html',          label: 'Perfil',         ativo: true },
        { href: 'peneiras.html',        label: 'Peneiras' },
        { href: 'criar-peneira.html',   label: 'Criar Peneira' },
        { href: 'treinos-professor.html',label: 'Criar Treino' },
        { href: 'login.html',           label: 'Sair' }
      ];
    }

    var menu_lateral = document.getElementById('menu-lateral');
    var html = '<img class="logo" src="../Logo/Next-removebg-preview.png" onclick="window.location.href = \'index.html\'">';
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      html += '<a href="' + l.href + '" class="link-menu' + (l.ativo ? ' ativo' : '') + '">' + l.label + '</a>';
    }
    menu_lateral.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', function() {
var caixa = document.getElementById('historicoPeneiras'); 
if (!caixa) return;
    
    var user = storage.current();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    buildSidebar(user.tipo);

    
    document.getElementById('heroNome').textContent  = user.nome  || '—';
    document.getElementById('heroEmail').textContent = user.email || '—';

    var badges = document.getElementById('heroBadges');
    if (user.posicao)      badges.innerHTML += '<span class="selo selo-vermelho">'    + user.posicao      + '</span>';
    if (user.categoria)    badges.innerHTML += '<span class="selo selo-azul">'   + user.categoria    + '</span>';
    if (user.time_coracao) badges.innerHTML += '<span class="selo selo-amarelo"> ' + user.time_coracao + '</span>';

    function preencher(id, valor) {
      var campo = document.getElementById(id);
      if (campo && valor) campo.value = valor;
    }
    preencher('fNome',     user.nome);
    preencher('fEmail',    user.email);
    preencher('fNasc',     user.data_nascimento);
    preencher('fCidade',   user.cidade);
    preencher('fPosicao',  user.posicao);
    preencher('fCategoria',user.categoria);
    preencher('fTime',     user.time_coracao);
    preencher('fAltura',   user.altura_cm);
    preencher('fPeso',     user.peso_kg);


  }); 

  function switchTab(nome, botaoClicado) {
    
    document.querySelectorAll('.painel-aba').forEach(function(p) { p.classList.remove('visivel'); });
    document.querySelectorAll('.botao-aba').forEach(function(b)   { b.classList.remove('ativo');  });
    
    document.getElementById('tab-' + nome).classList.add('visivel');
    botaoClicado.classList.add('ativo');
  }

  function salvar() {
    var senha  = document.getElementById('fSenha').value;
    var senha2 = document.getElementById('fSenha2').value;
    
    if (senha && senha !== senha2) {
      alerta('As senhas não coincidem.', 'erro');
      return;
    }

    var user = storage.current();

    var dadosAtualizados = {
      nome:            document.getElementById('fNome').value    || user.nome,
      email:           document.getElementById('fEmail').value   || user.email,
      data_nascimento: document.getElementById('fNasc').value,
      cidade:          document.getElementById('fCidade').value,
      posicao:         document.getElementById('fPosicao').value,
      categoria:       document.getElementById('fCategoria').value,
      time_coracao:    document.getElementById('fTime').value,
      altura_cm:       document.getElementById('fAltura').value,
      peso_kg:         document.getElementById('fPeso').value
    };
    if (senha) dadosAtualizados.senha = senha;

    fetch('/usuarios/' + user.id + '/perfil', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dadosAtualizados)
    })
    .then(function(resposta) {
      if (!resposta.ok) {
        return resposta.json().then(function(errorBody) {
          throw new Error(errorBody.mensagem || 'Erro ao salvar perfil.');
        });
      }
      return resposta.json();
    })
    .then(function(resultado) {
      if (resultado.usuario) {
        Object.assign(user, resultado.usuario);
      } else {
        Object.assign(user, dadosAtualizados);
      }

      storage.login(user);
      alerta('Perfil atualizado com sucesso!');

      document.getElementById('heroNome').textContent  = user.nome;
      document.getElementById('heroEmail').textContent = user.email;
    })
    .catch(function(erro) {
      console.error('Erro ao salvar perfil:', erro);
      alerta(erro.message || 'Erro ao salvar. Verifique o servidor.', 'erro');
    });
  }

  function cancelar() {
    location.reload();
  }

</script>
</body>
</html>
