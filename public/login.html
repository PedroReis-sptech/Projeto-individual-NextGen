<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen · Entrar</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styleLogin.css">
</head>
<body>
  <div class="grade-fundo"></div>
  <div class="brilho-fundo"></div>

  <div class="cartao">
    <div class="caixa-logo">
      <img src="../Logo/Next-removebg-preview.png" alt="NextGen" onclick="window.location.href = 'index.html'">
    </div>

    <div class="abas">
      <button class="botao-aba ativo" id="btnLogin"    onclick="switchTab('login')">Entrar</button>
      <button class="botao-aba"        id="btnCadastro" onclick="switchTab('cadastro')">Cadastrar</button>
    </div>

    <div class="secao-form visivel" id="secLogin">
      <h2>Bem-vindo de volta</h2>
      <p class="texto-sub">Entre para ver as peneiras abertas.</p>

      <div class="grupo-form">
        <label>E-mail</label>
        <input id="inEmail" type="email" placeholder="seu@email.com" required>
      </div>
      <div class="grupo-form">
        <label>Senha</label>
        <input id="inSenha" type="password" placeholder="••••••••" required>
      </div>

      <button class="botao botao-principal" onclick="logar()">Entrar</button>
      <div class="mensagem" id="msgLogin"></div>
    </div>

    <div class="secao-form" id="secCadastro">
      <h2>Crie sua conta</h2>

      <div class="grade2">
        <div class="grupo-form completo">
          <label>Nome completo *</label>
          <input id="cNome" type="text" placeholder="Seu nome" required>
        </div>
        <div class="grupo-form completo">
          <label>E-mail *</label>
          <input id="cEmail" type="email" placeholder="seu@email.com" required>
        </div>
        <div class="grupo-form">
          <label>Senha *</label>
          <input id="cSenha" type="password" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="grupo-form">
          <label>Data de nascimento</label>
          <input id="cNasc" type="date">
        </div>
        <div class="grupo-form">
          <label>Posição *</label>
          <select id="cPosicao" required>
            <option value="">Selecione</option>
            <option>Goleiro</option>
            <option>Zagueiro</option>
            <option>Lateral</option>
            <option>Volante</option>
            <option>Meia</option>
            <option>Atacante</option>
          </select>
        </div>
        <div class="grupo-form">
          <label>Categoria *</label>
          <select id="cCategoria" required>
            <option value="">Selecione</option>
            <option>Sub-11</option>
            <option>Sub-13</option>
            <option>Sub-15</option>
            <option>Sub-17</option>
            <option>Sub-20</option>
            <option>Profissional</option>
          </select>
        </div>
        <div class="grupo-form completo">
          <label>Time do coração</label>
          <input id="cTime" type="text" placeholder="Ex: Corinthians">
        </div>
        <div class="grupo-form">
          <label>Altura (cm)</label>
          <input id="cAltura" type="number" placeholder="Ex: 175">
        </div>
        <div class="grupo-form">
          <label>Peso (kg)</label>
          <input id="cPeso" type="number" placeholder="Ex: 68">
        </div>
        <div class="grupo-form completo">
          <label>Cidade</label>
          <input id="cCidade" type="text" placeholder="Ex: São Paulo">
        </div>
      </div>

      <button class="botao botao-principal" onclick="cadastrar()">Criar conta</button>
      <div class="mensagem" id="msgCadastro"></div>
    </div>
  </div>

  <script>
    var storage = {
      login: function(user) {
        localStorage.setItem('sessaoUser', JSON.stringify(user));
      },
      logout: function() {
        localStorage.removeItem('sessaoUser');
        window.location.href = 'login.html';
      },
      current: function() {
        try {
          return JSON.parse(localStorage.getItem('sessaoUser')) || null;
        } catch(e) {
          return null;
        }
      }
    };

    function alerta(mensagem, tipo) {
      var tipo_final = tipo || 'sucesso';
      var caixa = document.getElementById('toastContainer');
      if (!caixa) {
        caixa = document.createElement('div');
        caixa.id = 'toastContainer';
        caixa.className = 'caixa-alertas';
        document.body.appendChild(caixa);
      }
      var t = document.createElement('div');
      t.className = 'alerta alerta-' + tipo_final;
      t.innerHTML = '<span>' + (tipo_final === 'sucesso' ? '✓' : '✕') + '</span> ' + mensagem;
      caixa.appendChild(t);
      setTimeout(function() {
        t.remove();
      }, 3200);
    }


    var parametros = new URLSearchParams(location.search);
    if (parametros.get('aba') === 'cadastro') {
      switchTab('cadastro');
    }

    // Troca abas
    function switchTab(aba) {
      document.getElementById('secLogin').classList.toggle('visivel',    aba === 'login');
      document.getElementById('secCadastro').classList.toggle('visivel', aba === 'cadastro');
      document.getElementById('btnLogin').classList.toggle('ativo',     aba === 'login');
      document.getElementById('btnCadastro').classList.toggle('ativo',  aba === 'cadastro');
    }

    // LOGIN
    function logar() {
      var email = document.getElementById('inEmail').value.trim();
      var senha = document.getElementById('inSenha').value.trim();
      var mensagem   = document.getElementById('msgLogin');

      if (!email || !senha) {
        mensagem.textContent = 'Preencha o e-mail e a senha.';
        mensagem.className = 'mensagem erro';
        return;
      }

      mensagem.textContent = 'Verificando...';
      mensagem.className = 'mensagem';

      fetch('/usuarios/autenticar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha
        })
      })
      .then(function(resposta) {
        return resposta.json();
      })
      .then(function(dados) {
        if (dados.mensagem) {
          mensagem.textContent = dados.mensagem;
          mensagem.className = 'mensagem erro';
          return;
        }

        storage.login(dados);
        mensagem.textContent = 'Redirecionando...';
        mensagem.className = 'mensagem sucesso';

        setTimeout(function() {
          if (dados.tipo === 'aluno') {
            window.location.href = 'dashboard-aluno.html';
          } else {
            window.location.href = 'dashboard-admin.html';
          }
        }, 800);
      })
      .catch(function(erro) {
        console.error('Erro ao conectar com o servidor:', erro);
        mensagem.textContent = 'Erro ao conectar com o servidor. Verifique se ele está rodando.';
        mensagem.className = 'mensagem erro';
      });
    }

    // CADASTRO
    function cadastrar() {
      var nome      = document.getElementById('cNome').value.trim();
      var email     = document.getElementById('cEmail').value.trim();
      var senha     = document.getElementById('cSenha').value.trim();
      var posicao   = document.getElementById('cPosicao').value;
      var categoria = document.getElementById('cCategoria').value;
      var mensagem       = document.getElementById('msgCadastro');

      if (!nome || !email || !senha || !posicao || !categoria) {
        mensagem.textContent = 'Preencha todos os campos obrigatórios (marcados com *).';
        mensagem.className = 'mensagem erro';
        return;
      }
      if (senha.length < 6) {
        mensagem.textContent = 'A senha deve ter ao menos 6 caracteres.';
        mensagem.className = 'mensagem erro';
        return;
      }

      mensagem.textContent = 'Cadastrando...';
      mensagem.className = 'mensagem';

      fetch('/usuarios/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nomeServer:      nome,
          emailServer:     email,
          senhaServer:     senha,
          posicao:         posicao,
          categoria:       categoria,
          timeCoracao:     document.getElementById('cTime').value,
          dataNascimento:  document.getElementById('cNasc').value,
          cidade:          document.getElementById('cCidade').value,
          alturaCm:        document.getElementById('cAltura').value,
          pesoKg:          document.getElementById('cPeso').value
        })
      })
      .then(function(resposta) {
        return resposta.json();
      })
      .then(function(dados) {
        if (dados.mensagem && dados.id === undefined) {
          mensagem.textContent = dados.mensagem;
          mensagem.className = 'mensagem erro';
          return;
        }

        mensagem.textContent = 'Conta criada! Fazendo login...';
        mensagem.className = 'mensagem sucesso';

        storage.login({
          id:           dados.id,
          nome:         nome,
          email:        email,
          tipo:         'aluno',
          posicao:      posicao,
          categoria:    categoria,
          time_coracao: document.getElementById('cTime').value
        });

        setTimeout(function() {
          window.location.href = 'login.html';
        }, 1000);
      })
      .catch(function(erro) {
        console.error('Erro ao cadastrar:', erro);
        mensagem.textContent = 'Erro ao conectar com o servidor. Verifique se ele está rodando.';
        mensagem.className = 'mensagem erro';
      });
    }

  </script>
</body>
</html>
