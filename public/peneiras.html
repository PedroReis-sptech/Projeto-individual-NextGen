<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen - Peneiras SP</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/stylePeneiras.css">
</head>
<body>

    <div class="container">

        <!-- ── Cabeçalho ── -->
        <header class="cabecalho">
            <div class="cabecalho-texto">
                <h1>Próximas Peneiras</h1>
                <p>Oportunidades reais nos grandes clubes de São Paulo.</p>
            </div>
            <!-- Campo de busca por nome ou categoria -->
            <div class="busca-wrap">
                <span class="material-icons">search</span>
                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Buscar por nome ou categoria..."
                    oninput="filtrarPeneiras()"
                >
            </div>
        </header>

        <!-- ── Grid de cards (preenchido pelo JavaScript) ── -->
        <div class="grid-peneiras" id="gridPeneiras">
            <!-- Mensagem de carregando -->
            <p class="msg-carregando">
                <span class="material-icons">hourglass_empty</span>
                Carregando peneiras...
            </p>
        </div>

        <!-- ── Botão de voltar ── -->
        <div class="acoes-finais">
            <a href="dashboard-aluno.html" class="btn-voltar">
                <span class="material-icons">arrow_back</span>
                Voltar para a Dashboard
            </a>
        </div>

    </div>

    <script>

        // ─────────────────────────────────────────────
        // Guarda todas as peneiras carregadas
        // (para filtrar sem chamar a API de novo)
        // ─────────────────────────────────────────────
        var todasPeneiras = [];

        // ─────────────────────────────────────────────
        // Função: carregarPeneiras
        // Busca as peneiras na API e exibe os cards
        // ─────────────────────────────────────────────
        function carregarPeneiras() {
            fetch('/peneiras')
                .then(function(resposta) {
                    return resposta.json();
                })
                .then(function(peneiras) {
                    todasPeneiras = peneiras;
                    renderizarCards(peneiras);
                })
                .catch(function(erro) {
                    console.error('Erro ao carregar peneiras:', erro);
                    document.getElementById('gridPeneiras').innerHTML =
                        '<p class="msg-erro"><span class="material-icons">error</span> Erro ao carregar. Verifique se o servidor está rodando.</p>';
                });
        }

        // ─────────────────────────────────────────────
        // Função: renderizarCards
        // Recebe a lista e monta os cards no HTML
        // ─────────────────────────────────────────────
        function renderizarCards(lista) {
            var grid = document.getElementById('gridPeneiras');

            // Se não há peneiras, mostra mensagem
            if (!lista || lista.length === 0) {
                grid.innerHTML = '<p class="msg-vazio"><span class="material-icons">sports_soccer</span> Nenhuma peneira disponível no momento.</p>';
                return;
            }

            var html = '';

            for (var i = 0; i < lista.length; i++) {
                var p = lista[i];

                // Formata a data de YYYY-MM-DD para DD/MM/AAAA
                var dataFormatada = '—';
                if (p.data_realizacao) {
                    dataFormatada = p.data_realizacao.split('T')[0].split('-').reverse().join('/');
                }

                // Escolhe imagem do clube ou placeholder
                var imgSrc = p.escudo_url || '';
                var imgHtml = imgSrc
                    ? '<img src="' + imgSrc + '" alt="' + p.nome_clube + '" class="logo-time">'
                    : '<span class="material-icons logo-icone">sports_soccer</span>';

                html += '<div class="card-peneira">';

                // Cabeçalho do card: logo + nome do clube
                html +=   '<div class="card-header">';
                html +=     imgHtml;
                html +=     '<span class="badge-clube">' + (p.nome_clube || 'Sem clube') + '</span>';
                html +=   '</div>';

                // Nome da peneira
                html +=   '<h3>' + (p.nome || '—') + '</h3>';

                // Informações em lista com ícones
                html +=   '<div class="card-infos">';

                html +=     '<div class="card-info-item">';
                html +=       '<span class="material-icons">calendar_today</span>';
                html +=       '<span>' + dataFormatada + (p.horario ? ' às ' + p.horario : '') + '</span>';
                html +=     '</div>';

                html +=     '<div class="card-info-item">';
                html +=       '<span class="material-icons">location_on</span>';
                html +=       '<span>' + (p.cidade || p.local_endereco || '—') + '</span>';
                html +=     '</div>';

                html +=     '<div class="card-info-item">';
                html +=       '<span class="material-icons">label</span>';
                html +=       '<span>' + (p.categoria || '—') + '</span>';
                html +=     '</div>';

                if (p.vagas) {
                    html +=   '<div class="card-info-item">';
                    html +=     '<span class="material-icons">people</span>';
                    html +=     '<span>' + p.vagas + ' vagas</span>';
                    html +=   '</div>';
                }

                html +=   '</div>';

                // Rodapé do card
                html +=   '<div class="info-footer">';
                html +=     '<span class="badge badge-green">aberta</span>';
                // Link para a página de detalhes passando o id na URL
                html +=     '<a href="detalhe-peneira.html?id=' + p.id + '" class="btn-detalhes">';
                html +=       '<span class="material-icons">arrow_forward</span> Ver detalhes';
                html +=     '</a>';
                html +=   '</div>';

                html += '</div>';
            }

            grid.innerHTML = html;
        }

        // ─────────────────────────────────────────────
        // Função: filtrarPeneiras
        // Filtra os cards já carregados sem chamar a API
        // ─────────────────────────────────────────────
        function filtrarPeneiras() {
            var busca = document.getElementById('campoBusca').value.toLowerCase();

            var filtradas = todasPeneiras.filter(function(p) {
                return (p.nome      && p.nome.toLowerCase().includes(busca))
                    || (p.categoria && p.categoria.toLowerCase().includes(busca))
                    || (p.nome_clube && p.nome_clube.toLowerCase().includes(busca));
            });

            renderizarCards(filtradas);
        }

        // ─────────────────────────────────────────────
        // Quando a página carrega, busca as peneiras
        // ─────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            carregarPeneiras();
        });

    </script>

</body>
</html>
